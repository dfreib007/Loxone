services:
  loxone-voice:
    build: .
    container_name: loxone-voice
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import loxone_voice; print(loxone_voice.__version__)"]
      interval: 30s
      timeout: 5s
      retries: 3
