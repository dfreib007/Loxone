name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests (pytest, coverage gate)
        run: uv run pytest

      - name: Dependency audit (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --no-emit-project --quiet -o /tmp/audit.txt
          uv run pip-audit --strict -r /tmp/audit.txt --disable-pip --no-deps
